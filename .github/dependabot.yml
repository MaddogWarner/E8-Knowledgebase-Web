version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /services/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Keep @types/node aligned with the Node major in services/web/Dockerfile; revisit when that changes.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet (peer <6.1.0); revisit when it does.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
